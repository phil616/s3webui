# Go downstream. PostgreSQL and APP_ENCRYPTION_KEY are mandatory.
replicaCount: 1
strategy:
  type: RollingUpdate
image:
  registry: local
  repository: s3webui-go
  tag: dev
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: s3webui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
# No application volume: sessions, grants, users and audit all live in PostgreSQL.
persistence:
  enabled: false
  mountPath: /app/data
  size: 1Gi
  accessModes: [ReadWriteOnce]
  storageClass: ""
  existingClaim: ""
nodeSelector: {}
tolerations: []
affinity: {}
env:
  HTTP_ADDR: ":8080"
  PUBLIC_URL: "https://s3webui.example.com"
  COOKIE_SECURE: "true"
  ADMIN_EMAIL: "admin@example.com"
  SOURCE_ARCHIVE: "/usr/share/s3webui/source.tar.gz"
# Supply DATABASE_URL, ADMIN_PASSWORD, APP_ENCRYPTION_KEY from a Kubernetes Secret.
existingSecrets: []
secrets: {}
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
livenessProbe:
  enabled: true
  httpGet:
    path: /livez
    port: 8080
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
