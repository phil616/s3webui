name: Go and bilingual UI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/s3webui ./cmd/s3webui
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser checks against the Go server and PostgreSQL
        env:
          BROWSER_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: npm run test:browser
      - name: Build container including corresponding source
        run: docker build -t s3webui-go:test .
